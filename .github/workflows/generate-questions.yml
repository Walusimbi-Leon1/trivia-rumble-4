name: Generate Trivia Questions

# Keep the game's question bank topped up. The game drains ~180 questions/hour
# (20s per question, clock runs 24/7), so this runs every 15 minutes to keep
# a healthy runway. Public repo → free unlimited Actions minutes. Note: GitHub's
# scheduler can delay/skip runs under load — the worker's hard-reset recovery
# (never stall) is the safety net, this workflow is the freshness engine.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-questions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate & refill question bank
        run: node scripts/generate-questions.js
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: big-pickle
          FB_HOST: pop-party-1-default-rtdb.firebaseio.com
